:root{
  color-scheme: light dark;
  --bg:#E4E8F5; --stage:#EDF0FA; --ink:#141838; --dim:#5B628F; --grid:rgba(20,24,56,.13);
  --panel:rgba(250,251,255,.92); --panel-line:rgba(20,24,56,.14); --station:#FFFFFF;
  --blue:#0B78BC; --amber:#B06900; --violet:#5B3FD6; --pink:#C2307A; --teal:#078A79; --ice:#3A4072;
  --pass:#0E9A4B; --fail:#D3324A;
  --display:"Big Shoulders Display","Big Shoulders","Barlow Condensed","Arial Narrow",sans-serif;
  --sans:"Overpass","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --mono:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1030; --stage:#13173C; --ink:#E9ECFF; --dim:#8F97C9; --grid:rgba(233,236,255,.08);
    --panel:rgba(19,23,60,.9); --panel-line:rgba(233,236,255,.14); --station:#13173C;
    --blue:#4FC3F7; --amber:#FFB547; --violet:#A98BFF; --pink:#FF7AB6; --teal:#2DD4BF; --ice:#C3CAF2;
    --pass:#4ADE80; --fail:#FF5A6E;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1030; --stage:#13173C; --ink:#E9ECFF; --dim:#8F97C9; --grid:rgba(233,236,255,.08);
  --panel:rgba(19,23,60,.9); --panel-line:rgba(233,236,255,.14); --station:#13173C;
  --blue:#4FC3F7; --amber:#FFB547; --violet:#A98BFF; --pink:#FF7AB6; --teal:#2DD4BF; --ice:#C3CAF2;
  --pass:#4ADE80; --fail:#FF5A6E;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}

.app{height:100%;display:flex;flex-direction:column}
.stage-wrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 16px 6px}
.stage{position:relative;overflow:hidden;border-radius:18px;background:var(--stage);container-type:inline-size;
  box-shadow:0 0 0 1px var(--panel-line)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.below{display:none}

/* stacked layout for narrow screens */
.app.stacked{height:auto;min-height:100%}
.app.stacked .stage-wrap{flex:none;padding:10px 10px 0}
.app.stacked .stage{width:100%;aspect-ratio:16/9;border-radius:14px}
.app.stacked .below{display:block;padding:12px 14px 4px;container-type:inline-size}

/* section badge */
.badge{position:absolute;left:2.4%;top:3.4%;display:flex;align-items:center;gap:.55em;
  font-weight:700;font-size:clamp(11px,1.45cqw,19px);letter-spacing:.01em;
  padding:.35em .8em .3em .45em;border-radius:999px;background:var(--panel);box-shadow:0 0 0 1px var(--panel-line);
  transition:opacity .4s}
.badge .dot{width:1.05em;height:1.05em;border-radius:50%;background:var(--lc);box-shadow:0 0 0 .2em var(--station) inset, 0 0 0 .14em var(--lc)}

/* board */
.board{position:absolute;right:2.2%;top:3.4%;width:33%;max-height:62%;overflow:hidden;
  background:var(--panel);border-radius:14px;box-shadow:0 0 0 1px var(--panel-line);
  padding:1.1cqw 1.3cqw 1.2cqw;opacity:0;transform:translateY(-6px);transition:opacity .35s, transform .35s;
  border-left:.42cqw solid var(--lc)}
.board.show{opacity:1;transform:none}
.board-title{font-family:var(--mono);font-weight:600;font-size:clamp(11px,1.32cqw,18px);margin:0 0 .7em;overflow-wrap:anywhere}
.board-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.62em}
.row{display:grid;grid-template-columns:1.15em 1fr;column-gap:.6em;align-items:start;opacity:0;transform:translateX(6px);transition:opacity .3s, transform .3s}
.row.in{opacity:1;transform:none}
.row .k{font-family:var(--mono);font-size:clamp(9.5px,1.02cqw,14px);color:var(--dim);overflow-wrap:anywhere;line-height:1.25}
.row .v{grid-column:2;font-size:clamp(11px,1.22cqw,16.5px);line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.ico{grid-row:1 / span 2;width:1.05em;height:1.05em;margin-top:.15em;border-radius:50%;box-shadow:0 0 0 .14em var(--dim) inset;font-size:clamp(10px,1.2cqw,16px)}
.row.s-info .ico{border-radius:3px;box-shadow:none;background:var(--lc);transform:scale(.62)}
.row.s-run .ico{box-shadow:0 0 0 .16em var(--amber) inset;background:conic-gradient(var(--amber) 0 50%, transparent 50% 100%);animation:spin 1s linear infinite}
.row.s-pass .ico{background:var(--pass);box-shadow:none;position:relative}
.row.s-pass .ico::after{content:"";position:absolute;left:.32em;top:.18em;width:.26em;height:.5em;border:solid var(--station);border-width:0 .13em .13em 0;transform:rotate(45deg)}
.row.s-fail .ico{background:var(--fail);box-shadow:none;position:relative}
.row.s-fail .ico::after{content:"";position:absolute;left:.46em;top:.2em;width:.13em;height:.42em;background:var(--station);box-shadow:0 .55em 0 var(--station)}
.meter{display:block;height:.55em;margin-top:.35em;border-radius:99px;background:color-mix(in srgb, var(--dim) 30%, transparent);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--pass);border-radius:99px}
@keyframes spin{to{transform:rotate(1turn)}}

/* lyrics */
.lyrics{position:absolute;left:0;right:0;bottom:0;padding:5cqw 4.2% 2.6cqw;
  background:linear-gradient(to bottom, transparent, color-mix(in srgb, var(--stage) 82%, transparent) 38%, var(--stage) 92%);
  pointer-events:none}
.ly-now{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(20px,4.1cqw,64px);line-height:1.02;letter-spacing:.005em;min-height:1.02em;max-width:92%}
.ly-next{margin:.45em 0 0;font-weight:600;font-size:clamp(11px,1.5cqw,21px);color:var(--dim);min-height:1.3em;max-width:85%}
.w{background:linear-gradient(90deg,var(--ink) 0 var(--f,0%),color-mix(in srgb, var(--dim) 62%, transparent) var(--f,0%) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-decoration-line:none;text-decoration-thickness:.07em;text-underline-offset:.14em}
.w.cur{text-decoration-line:underline;text-decoration-color:var(--lc)}
.below .lyrics{position:static;background:none;padding:0}
.below .ly-now{font-size:clamp(22px,7cqw,40px);max-width:none}
.below .ly-next{font-size:clamp(13px,3.6cqw,18px)}
.below .board{position:static;width:auto;max-height:none;margin-top:14px;padding:12px 14px;border-left-width:5px}
.below .board-title{font-size:14px}.below .row .k{font-size:12px}.below .row .v{font-size:14.5px}.below .ico{font-size:14px}

/* title + end cards */
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:4%;transition:opacity .6s;background:radial-gradient(ellipse 60% 55% at 50% 50%, color-mix(in srgb, var(--stage) 88%, transparent), transparent 78%)}
.card[hidden]{display:none}
.card h1,.card h2{margin:0;font-family:var(--display);font-weight:800;line-height:.9;letter-spacing:.005em}
.card h1{font-size:clamp(40px,10.5cqw,150px)}
.card h2{font-size:clamp(34px,8cqw,120px)}
.card p{margin:.9em 0 0;font-size:clamp(12px,1.75cqw,22px);color:var(--dim);font-weight:600;max-width:36em}
.card code{font-family:var(--mono);font-weight:600;color:var(--ink)}
.big-btn{margin-top:1.6em;display:inline-flex;align-items:center;gap:.6em;border:0;cursor:pointer;
  font-weight:800;font-size:clamp(14px,1.7cqw,22px);padding:.7em 1.4em .62em;border-radius:999px;background:var(--ink);color:var(--stage)}
.big-btn svg{width:1em;height:1em}
.big-btn:hover{filter:brightness(1.08)}
.hook-line{font-family:var(--display)!important;font-size:clamp(18px,3.2cqw,46px)!important;color:var(--pass)!important;font-weight:800!important;margin-top:.25em!important}

/* controls */
.controls{flex:none;display:flex;align-items:center;gap:14px;padding:8px 18px 14px;flex-wrap:wrap}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:var(--stage);display:grid;place-items:center;cursor:pointer}
.play svg{width:18px;height:18px}
.tl{flex:1 1 260px;min-width:180px;display:flex;align-items:center}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;margin:0;--p:0%}
#seek::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(to right, transparent 0 var(--p), color-mix(in srgb, var(--stage) 62%, transparent) var(--p) 100%), var(--track)}
#seek::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(to right, transparent 0 var(--p), color-mix(in srgb, var(--stage) 62%, transparent) var(--p) 100%), var(--track)}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--stage);margin-top:-5px}
#seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--stage)}
.time{flex:none;font-family:var(--mono);font-size:14px;color:var(--dim);min-width:8.5ch;text-align:right}
.txt-btn{flex:none;border:0;background:transparent;font-weight:700;font-size:14px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink);box-shadow:0 0 0 1px var(--panel-line)}
.txt-btn:hover{background:var(--panel)}
.sw{flex:none;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer;user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:99px;background:color-mix(in srgb, var(--dim) 45%, transparent);position:relative;cursor:pointer;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--stage);transition:transform .2s}
.sw input:checked{background:var(--pass)}
.sw input:checked::after{transform:translateX(16px)}

/* lyrics sheet */
dialog{border:0;padding:0;border-radius:16px;background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--panel-line), 0 20px 60px rgba(0,0,0,.35);
  width:min(640px,calc(100% - 28px));max-height:min(82%,760px);backdrop-filter:blur(10px)}
dialog::backdrop{background:color-mix(in srgb, var(--bg) 70%, transparent)}
.sheet{padding:22px 24px 26px;overflow:auto;max-height:inherit}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet h3{margin:0;font-family:var(--display);font-weight:800;font-size:34px}
.sheet h4{margin:20px 0 6px;font-size:13px;font-weight:800;color:var(--dim);display:flex;align-items:center;gap:8px}
.sheet h4 span{width:12px;height:12px;border-radius:50%;background:var(--lc)}
.sheet ol{list-style:none;margin:0;padding:0}
.sheet li button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1.35}
.sheet li button:hover{background:color-mix(in srgb, var(--dim) 16%, transparent)}

/* ---------- SVG map ---------- */
.griddot{fill:var(--grid)}
.case{fill:none;stroke:var(--stage);stroke-linecap:round;stroke-linejoin:round}
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.c-amber{stroke:var(--amber)}.c-blue{stroke:var(--blue)}.c-violet{stroke:var(--violet)}.c-teal{stroke:var(--teal)}
.c-pink{stroke:var(--pink)}.c-ink{stroke:var(--ink)}.c-ice{stroke:var(--ice)}.c-fail{stroke:var(--fail)}.c-pass{stroke:var(--pass)}
.arrowhead{fill:var(--ice)}
.dot{fill:var(--station);stroke:var(--ink);stroke-width:5}
.dot.term{stroke-width:6}
.st{transform-box:fill-box;transform-origin:center}
.st .halo{fill:var(--lc);opacity:0;transition:opacity .35s}
.st.lit .halo{opacity:.3}
.st.lit .dot{stroke:var(--lc)}
.st.lit{transform:scale(calc(1 + var(--pulse,0) * .2))}
.gatebar{fill:var(--station);stroke:var(--ink);stroke-width:4;transition:fill .2s}
.st.g-run .gatebar{fill:var(--amber)}
.st.g-pass .gatebar{fill:var(--pass)}
.st.g-fail .gatebar{fill:var(--fail)}
.st.g-hang .gatebar{fill:var(--fail);animation:blink .5s steps(2,jump-none) infinite}
.st.g-run .halo,.st.g-hang .halo{fill:var(--amber);opacity:.32}
.st.g-pass .halo{fill:var(--pass)}
.st.g-fail .halo{fill:var(--fail);opacity:.32}
@keyframes blink{50%{opacity:.35}}
.lbl{font-family:var(--sans);font-weight:700;font-size:23px;fill:var(--ink);transition:opacity .35s, fill .35s}
.lbl.code{font-family:var(--mono);font-weight:600;font-size:20px}
.lbl.small{font-size:17px}
.lbl.gl{font-size:18px}
.lbl.note{font-weight:600;font-size:18px;fill:var(--dim)}
.lbl.lit{fill:var(--lc)}
svg.focus .lbl:not(.lit){opacity:.42}
.yard text{font-family:var(--sans)}
.plate-bg{fill:var(--station);stroke:color-mix(in srgb, var(--dim) 55%, transparent);stroke-width:2;transition:stroke .35s}
.pl-name{font-family:var(--mono)!important;font-weight:600;font-size:16px;fill:var(--ink)}
.pl-name.big{font-size:21px}
.pl-sub{font-weight:600;font-size:15.5px;fill:var(--dim)}
.pl-on{fill:var(--teal)}
.chip{fill:color-mix(in srgb, var(--teal) 14%, var(--station));stroke:color-mix(in srgb, var(--teal) 55%, transparent);stroke-width:1.5}
.chip-t{font-weight:700;font-size:15px;fill:var(--ink)}
.tr{font-family:var(--mono)!important;font-size:18px;fill:var(--dim)}
.tr.b{fill:var(--ink);font-weight:600}
.tree-guide{fill:none;stroke:color-mix(in srgb, var(--dim) 55%, transparent);stroke-width:2}
.yard > g{transition:opacity .4s}
svg.focus .yard > g:not(.lit){opacity:.5}
.yard > g.lit .plate-bg{stroke:var(--teal);stroke-width:3.5}
.yard > g.lit .tr{fill:var(--ink)}
.yard > g.lit .tree-guide{stroke:var(--teal)}
.tok{transition:opacity .25s}
.tok .th{fill:var(--tc);opacity:.28}
.tok .tb{fill:var(--tc);stroke:var(--station);stroke-width:4}
.tok.ghost{opacity:.45}

@media (prefers-reduced-motion: reduce){
  .row.s-run .ico,.st.g-hang .gatebar{animation:none}
  .st.lit{transform:none}
}
@media (max-width:520px){
  .controls{gap:10px;padding:8px 10px 12px}
  .time{font-size:12.5px}
}

    if(gs.ready)lit.push('ready');if(gs.draft)lit.push('draft');if(gs.loop)lit.push('loopL');if(gs.hatch)lit.push('hatchL');
    if(gs.commits&&(sec.variant==='final'?lt<11.5:lt<14.4))lit.push('commits');
    if(sec.variant==='final'&&lt>=12.6)lit.push('rel1','rel2','rel3');
  }
  if(sec.id==='br')lit.push(lt<8?'g2':'g3');
  if(sec.id==='end')lit.push('ready');
  setLit(lit);
  // tokens
  const toks=sectionTokens(sec,lt);
  G.toks.forEach((g,i)=>{const tk=toks[i];if(!tk||!PATH_EL[tk.path]){if(g._on){g.style.opacity=0;g._on=false;}return;}
    const p=PATH_EL[tk.path].getPointAtLength(PLEN[tk.path]*clamp(tk.f,0,1));g.setAttribute('transform',`translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
    g.style.setProperty('--tc',`var(--${tk.color})`);g.classList.toggle('ghost',!!tk.ghost);if(!g._on){g.style.opacity=1;g._on=true;}});
  // pulse on the beat
  const beatPhase=(t%BEAT)/BEAT,pulsing=!prefersReduced&&(sec.kind==='chorus'||sec.kind==='pre'||(sec.kind==='verse'&&sec.energy>0));
  G.svg.style.setProperty('--pulse',pulsing?Math.exp(-beatPhase*7).toFixed(3):'0');
  // board, lyrics, badge
  renderBoard(bspec,sec,lt,line,t);
  renderLyrics(t,li,sec);
  if(sec.id!==lastSecId){lastSecId=sec.id;badgeText.textContent=sec.name;badge.style.setProperty('--lc',`var(--${sec.color==='dim'?'ice':sec.color})`);}
  // cards
  const tc=$('#titleCard'),ec=$('#endCard');
  if(!started){tc.hidden=false;tc.style.opacity=1;}
  else{const o=t<5.2?1:clamp((7.4-t)/2.2,0,1);tc.hidden=o<=0;tc.style.opacity=o;$('#bigPlay').hidden=true;}
  const eo=clamp((t-178.4)/1,0,1);ec.hidden=eo<=0;ec.style.opacity=eo;lyricsEl.style.opacity=1-eo;
  badge.style.opacity=started&&t>6&&t<177?1:0;
  // controls
  seek.style.setProperty('--p',(t/SONG_END*100).toFixed(2)+'%');
  if(!scrubbing&&Math.abs(+seek.value-t)>=1)seek.value=Math.floor(t);
  const tt=Math.floor(t),txtT=`${Math.floor(tt/60)}:${String(tt%60).padStart(2,'0')} / 3:00`;if(timeEl.textContent!==txtT)timeEl.textContent=txtT;
}

/* ================= Playback ================= */
const prefersReduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let ac=null,engine=null,playing=false,started=false,pausedT=0,offset=0,ctxStart=0,nextStep=0,timer=null,scrubbing=false,scrubT=0,speakOn=false;
const seek=$('#seek'),timeEl=$('#time'),playBtn=$('#playBtn');
function ensureAudio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();engine=makeEngine(ac,ac.destination);}
function rawNow(){return playing?offset+(ac.currentTime-ctxStart):pausedT;}
function visNow(){if(!playing)return pausedT;const lat=(ac.outputLatency||0)+(ac.baseLatency||0);return Math.max(offset,offset+(ac.currentTime-ctxStart)-lat);}
function tick(){
  const horizon=ac.currentTime+(document.hidden?1.2:.16);
  while(nextStep<TOTAL_STEPS){const tt=ctxStart+nextStep*STEP-offset;if(tt>horizon)break;if(tt>=ac.currentTime-.02)engine.step(nextStep,Math.max(tt,ac.currentTime));nextStep++;}
}
async function play(from){
  ensureAudio();try{await ac.resume();}catch(e){}
  offset=from!=null?from:pausedT;if(offset>=SONG_END-.5)offset=0;
  engine.session();ctxStart=ac.currentTime+.08;nextStep=Math.ceil(offset/STEP-1e-6);
  const bar=Math.floor(offset/BAR),inBar=offset-bar*BAR;if(inBar>.05&&bar<TOTAL_BARS)engine.padAt(bar,ctxStart,BAR-inBar);
  playing=true;started=true;clearInterval(timer);timer=setInterval(tick,25);tick();setBtn();lastLi=-99;
}
function pause(){if(!playing)return;pausedT=clamp(rawNow(),0,SONG_END);playing=false;clearInterval(timer);engine.kill();stopSpeech();setBtn();}
function seekTo(t){t=clamp(t,0,SONG_END-.05);snapCam=true;lastLi=-99;if(playing){pause();pausedT=t;play(t);}else{pausedT=t;}}
function toggle(){playing?pause():play();}
function setBtn(){playBtn.setAttribute('aria-label',playing?'Pause':'Play');$('#playIcon').setAttribute('d',playing?'M3 1.5h3.6v13H3zM9.4 1.5H13v13H9.4z':'M3 1.5v13l11-6.5z');}
function stopSpeech(){try{speechSynthesis.cancel();}catch(e){}}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/—/g,','));u.rate=1.08;u.volume=.9;speechSynthesis.speak(u);}catch(e){}}

/* ================= UI wiring ================= */
function buildTrack(){
  const tot=SONG_END;const stops=SECTIONS.map(s=>{const a=(s.start/tot*100).toFixed(2),b=(s.end/tot*100-.35).toFixed(2),c=`var(--${s.color==='dim'?'ice':s.color})`;
    return`${c} ${a}%, ${c} ${b}%, transparent ${b}%, transparent ${(s.end/tot*100).toFixed(2)}%`;}).join(', ');
  seek.style.setProperty('--track',`linear-gradient(to right, ${stops})`);
}
function buildSheet(){
  const body=$('#sheetBody');let curSec=null,ol=null;
  LINES.forEach(L=>{
    if(L.sec!==curSec){curSec=L.sec;const h=document.createElement('h4');h.style.setProperty('--lc',`var(--${L.sec.color==='dim'?'ice':L.sec.color})`);
      h.innerHTML='<span></span>';h.appendChild(document.createTextNode(L.sec.name));body.appendChild(h);ol=document.createElement('ol');body.appendChild(ol);}
    const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.textContent=L.display;
    b.addEventListener('click',()=>{$('#sheet').close();if(!started){play(L.start);}else seekTo(L.start);});li.appendChild(b);ol.appendChild(li);
  });
}
function wire(){
  playBtn.addEventListener('click',toggle);
  $('#bigPlay').addEventListener('click',()=>play(0));
  $('#replay').addEventListener('click',()=>{snapCam=true;play(0);});
  seek.addEventListener('input',()=>{scrubbing=true;scrubT=+seek.value;});
  seek.addEventListener('change',()=>{scrubbing=false;if(!started&&!playing){started=true;}seekTo(+seek.value);});
  $('#lyricsBtn').addEventListener('click',()=>$('#sheet').showModal());
  $('#sheetClose').addEventListener('click',()=>$('#sheet').close());
  const sp=$('#speak');if(!('speechSynthesis' in window))$('#speakWrap').hidden=true;
  sp.addEventListener('change',()=>{speakOn=sp.checked;if(!speakOn)stopSpeech();});
  document.addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('dialog'))return;
    if(e.code==='Space'&&!(e.target instanceof HTMLButtonElement)&&!(e.target instanceof HTMLInputElement&&e.target.type==='checkbox')){e.preventDefault();toggle();}
    else if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target===document.body){e.preventDefault();seekTo((playing?rawNow():pausedT)+(e.key==='ArrowRight'?5:-5));}
  });
  addEventListener('resize',doLayout);
}
let lastFrame=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-lastFrame)/1000);lastFrame=now;
  let t=scrubbing?scrubT:(playing?visNow():pausedT);
  if(playing&&rawNow()>=SONG_END+1.3){pause();pausedT=SONG_END-.01;t=pausedT;}
  update(clamp(t,0,SONG_END-.01),dt);
  requestAnimationFrame(loop);
}
buildMap();computeFracs();buildTrack();buildSheet();wire();doLayout();
(function debugHook(){const q=new URLSearchParams(location.search);if(!q.has('debug'))return;
  if(q.get('theme'))document.documentElement.setAttribute('data-theme',q.get('theme'));
  if(q.has('t')){started=true;pausedT=+q.get('t');}
  window.__engineTest=async(mute={},sr=16000,secId='c1')=>{
    const sec=SEC[secId],s0=sec.bar*16,s1=(sec.bar+sec.len)*16,dur=(s1-s0)*STEP+2;
    const oc=new OfflineAudioContext(2,Math.ceil(dur*sr),sr),eng=makeEngine(oc,oc.destination,mute);eng.session();
    const t0=performance.now();for(let s=s0;s<s1;s++)eng.step(s,(s-s0)*STEP+.02);
    const buf=await oc.startRendering(),L=buf.getChannelData(0),R=buf.getChannelData(1);let peak=0,sum=0,n=0;
    const end=Math.floor((s1-s0)*STEP*sr);
    for(let i=0;i<end;i++){const v=Math.max(Math.abs(L[i]),Math.abs(R[i]));if(v>peak)peak=v;const m=(L[i]+R[i])/2;sum+=m*m;n++;}
    return{peak:+peak.toFixed(3),rms:+(10*Math.log10(sum/n+1e-12)).toFixed(1),ms:Math.round(performance.now()-t0)};
  };
  window.__lines=LINES.map(l=>({start:l.start,text:l.display,n:l.words.length}));
})();
requestAnimationFrame(loop);
</script>
</body>
